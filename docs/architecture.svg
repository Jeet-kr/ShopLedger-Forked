<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">ShopLedger application architecture</title>
<desc id="desc">Architecture map of the ShopLedger browser UI, Express server, routers, libraries, configuration and JSON store, with numbered order placement flow.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#53657a"/></marker>
  <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2878b8"/></marker>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#172b4d}
    .title{font-size:25px;font-weight:700}.subtitle{font-size:14px;fill:#53657a}
    .heading{font-size:17px;font-weight:700}.label{font-size:14px;font-weight:700}
    .small{font-size:12px}.body{font-size:13px}.step{font-size:13px;font-weight:700;fill:#fff}
    .panel{fill:#f5f8fc;stroke:#b8c7d9;stroke-width:1.5}.node{fill:#fff;stroke:#8da2b8;stroke-width:1.4}
    .focus{fill:#fff1d9;stroke:#dc8b16;stroke-width:2}.line{fill:none;stroke:#53657a;stroke-width:1.8;marker-end:url(#arrow)}
    .flow{fill:none;stroke:#2878b8;stroke-width:2.5;marker-end:url(#blueArrow)}
  </style>
</defs>
<rect width="1200" height="800" fill="#ffffff"/>
<text x="30" y="38" class="title">ShopLedger | Application architecture</text>
<text x="30" y="62" class="subtitle">Express POS, Khata ledger and invoice app • named files and functions verified in source</text>

<!-- browser and server -->
<rect x="30" y="82" width="230" height="92" rx="10" class="node"/>
<text x="48" y="108" class="heading">Browser UI</text>
<text x="48" y="131" class="body">public/index.html</text>
<text x="48" y="151" class="body">public/js/app.js · public/css/style.css</text>
<rect x="338" y="82" width="250" height="92" rx="10" class="node"/>
<text x="358" y="108" class="heading">server.js · Express app</text>
<text x="358" y="131" class="body">Static public/ + mounts routers</text>
<text x="358" y="151" class="body">GET /orders/:id/invoice → render</text>
<path d="M260 128 H338" class="line"/>
<text x="273" y="116" class="small">HTTP</text>

<!-- routers -->
<rect x="30" y="204" width="558" height="154" rx="12" class="panel"/>
<text x="48" y="229" class="heading">routes/ · mounted under /api</text>
<rect x="48" y="245" width="250" height="46" rx="7" class="node"/>
<text x="62" y="265" class="label">orders.js</text><text x="62" y="282" class="small">POST /orders · cancel · list/get</text>
<rect x="316" y="245" width="250" height="46" rx="7" class="node"/>
<text x="330" y="265" class="label">products.js</text><text x="330" y="282" class="small">products · active coupons</text>
<rect x="48" y="301" width="250" height="42" rx="7" class="node"/>
<text x="62" y="319" class="label">customers.js</text><text x="62" y="336" class="small">customer balances · settlement</text>
<rect x="316" y="301" width="250" height="42" rx="7" class="node"/>
<text x="330" y="319" class="label">reports.js</text><text x="330" y="336" class="small">preview · dashboard · GST reconciliation</text>
<path d="M463 174 V190 H310 V204" class="line"/>
<path d="M310 190 H590 V217" class="line"/>

<!-- lib panel -->
<rect x="620" y="82" width="550" height="490" rx="12" class="panel"/>
<text x="642" y="109" class="heading">lib/ · application modules</text>
<text x="642" y="132" class="small">Order placement path highlighted in blue, steps 1–6</text>

<rect x="642" y="150" width="232" height="66" rx="8" class="node"/>
<text x="658" y="175" class="label">inventory.js</text><text x="658" y="197" class="small">find · check · reserve · release</text>
<rect x="900" y="150" width="244" height="66" rx="8" class="node"/>
<text x="916" y="175" class="label">pricing.js</text><text x="916" y="197" class="small">subtotal · computeTotals</text>

<rect x="642" y="236" width="232" height="66" rx="8" class="node"/>
<text x="658" y="261" class="label">coupons.js</text><text x="658" y="283" class="small">normalize · validate · discount</text>
<rect x="900" y="236" width="244" height="66" rx="8" class="focus"/>
<text x="916" y="261" class="label">tax.js · highlighted dependency</text><text x="916" y="283" class="small">HSN/default rate · CGST/SGST split</text>

<rect x="642" y="322" width="232" height="66" rx="8" class="node"/>
<text x="658" y="347" class="label">ledger.js</text><text x="658" y="369" class="small">Khata charge · customer lookup</text>
<rect x="900" y="322" width="244" height="66" rx="8" class="node"/>
<text x="916" y="347" class="label">orders.js</text><text x="916" y="369" class="small">add · get · cancel · list</text>

<rect x="642" y="408" width="232" height="66" rx="8" class="node"/>
<text x="658" y="433" class="label">store.js</text><text x="658" y="455" class="small">read · write · appendAudit</text>
<rect x="900" y="408" width="244" height="66" rx="8" class="focus"/>
<text x="916" y="433" class="label">invoice.js · ticket focus</text><text x="916" y="455" class="small">computeInvoiceFigures · render</text>

<rect x="642" y="494" width="232" height="54" rx="8" class="node"/>
<text x="658" y="517" class="label">reports.js</text><text x="658" y="537" class="small">dashboard · GST reconciliation</text>
<rect x="900" y="494" width="244" height="54" rx="8" class="node"/>
<text x="916" y="517" class="label">dates.js</text><text x="916" y="537" class="small">today · date keys · fiscal year</text>

<!-- config and data -->
<rect x="30" y="390" width="252" height="90" rx="10" class="node"/>
<text x="48" y="418" class="heading">config.js</text>
<text x="48" y="441" class="body">Shop details · GST slabs · coupons</text>
<text x="48" y="462" class="body">port · inventory defaults</text>
<rect x="328" y="390" width="260" height="90" rx="10" class="node"/>
<text x="346" y="418" class="heading">data/db.json</text>
<text x="346" y="441" class="body">Products · orders · customers</text>
<text x="346" y="462" class="body">settlements · audit log</text>
<path d="M282 435 H328" class="line"/>
<path d="M588 435 H620" class="line"/>

<!-- highlighted numbered order flow -->
<rect x="30" y="510" width="558" height="178" rx="12" class="panel"/>
<text x="48" y="535" class="heading">Order placement | numbered request/persistence flow</text>
<circle cx="57" cy="560" r="11" fill="#2878b8"/><text x="53" y="565" class="step">1</text>
<text x="77" y="565" class="body">public/js/app.js → POST /api/orders</text>
<circle cx="57" cy="584" r="11" fill="#2878b8"/><text x="53" y="589" class="step">2</text>
<text x="77" y="589" class="body">routes/orders.js reads store.read(); resolves items</text>
<circle cx="57" cy="608" r="11" fill="#2878b8"/><text x="53" y="613" class="step">3</text>
<text x="77" y="613" class="body">inventory.check() + coupons.validate()</text>
<circle cx="57" cy="632" r="11" fill="#2878b8"/><text x="53" y="637" class="step">4</text>
<text x="77" y="637" class="body">pricing.computeTotals() → tax.getRateForItem()</text>
<circle cx="57" cy="656" r="11" fill="#2878b8"/><text x="53" y="661" class="step">5</text>
<text x="77" y="661" class="body">Khata: ledger.chargeOrderToKhata(); inventory.reserve()</text>
<circle cx="57" cy="680" r="11" fill="#2878b8"/><text x="53" y="685" class="step">6</text>
<text x="77" y="685" class="body">orders.add() + appendAudit() → store.write(db) → db.json</text>

<!-- flow connectors -->
<path d="M288 570 H620 V183 H642" class="flow"/>
<path d="M874 183 H900" class="flow"/>
<path d="M1018 216 V236" class="flow"/>
<path d="M900 269 H874" class="flow"/>
<path d="M758 302 V322" class="flow"/>
<path d="M874 355 H900" class="flow"/>
<path d="M1018 388 V408" class="flow"/>
<path d="M642 441 H588" class="flow"/>

<!-- invoice endpoint and legend -->
<rect x="620" y="602" width="550" height="86" rx="10" fill="#fff8eb" stroke="#dc8b16" stroke-width="1.5"/>
<text x="642" y="629" class="label">Printable invoice path</text>
<text x="642" y="652" class="body">server.js GET /orders/:id/invoice → orders.get() → invoice.render()</text>
<text x="642" y="674" class="body">invoice.computeInvoiceFigures() recalculates from saved order lines</text>
<rect x="30" y="722" width="18" height="18" rx="4" class="focus"/>
<text x="58" y="736" class="small">Ticket focus: invoice.js and tax.js (tax.js is used by checkout pricing.js)</text>
<line x1="30" y1="757" x2="75" y2="757" stroke="#2878b8" stroke-width="2.5" marker-end="url(#blueArrow)"/>
<text x="88" y="762" class="small">Numbered order flow / persistence connections</text>
<text x="842" y="762" class="small">All paths are relative to project root</text>
</svg>
